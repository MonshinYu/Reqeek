<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Reqeek</title>
    <meta
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
      http-equiv="Content-Security-Policy"
    />
  </head>

  <body>
    <div id="root">
      <!--
        窗口是立刻显示的，这段静态加载态负责接住「JS 还没跑起来」的那一帧。
        放在 #root 里面是有意的：React 挂载时会清空容器，它自动退场，不用另写清理逻辑。
        样式只能自带 —— 这时 tokens.css 还没加载，所以颜色是从 tokens.css 抄过来的，
        与 --md-surface / --md-primary / --md-outline-variant 一一对应，改主题色时这里要一起改。
      -->
      <style>
        #boot {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 8px;
          background: #f9f9ff;
        }

        #boot::before {
          content: '';
          flex: none;
          width: 28px;
          height: 28px;
          /* 边框粗细与 Spinner 组件同一条公式：max(2px, 直径 / 10) */
          border: 2.8px solid #c4c6d0;
          border-top-color: #415f91;
          border-radius: 50%;
          animation: boot-spin 0.8s linear infinite;
        }

        /* 空占位，撑出与 React 那份加载文案相同的高度：否则接管时圆环会往上跳半行 */
        #boot::after {
          content: '';
          font-size: 13px;
          line-height: normal;
          min-height: 1lh;
        }

        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }

        @media (prefers-color-scheme: dark) {
          #boot {
            background: #1b1b1f;
          }

          #boot::before {
            border-color: #44464f;
            border-top-color: #b4c5ff;
          }
        }
      </style>
      <div id="boot"></div>
    </div>
    <script src="/src/views/Home/index.tsx" type="module"></script>
  </body>
</html>
