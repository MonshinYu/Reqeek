name: Release

# 触发方式：只能在 Actions 页面手动运行，提交代码和推送标签都不会自动触发。
#   - 填写 tag（如 v0.1.0）→ 构建该标签四个平台的安装包，并创建草稿 Release。
#     标签必须已经在远端，否则会在「确认标签已推送到远端」这一步直接报错。
#     首次使用请先执行：git tag v0.1.0 && git push origin v0.1.0
#   - 留空 tag            → 在当前分支上构建，只上传构建产物，不创建 Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签（如 v0.1.0）。留空则只构建产物，不创建 Release'
        required: false
        type: string

# 默认只读，发布所需的写权限单独授予 release job
permissions:
  contents: read

# 同一个标签重复触发时排队执行，不打断正在进行的发布
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # 单个平台失败不牵连其他平台，便于一次看清哪些架构有问题
      fail-fast: false
      matrix:
        include:
          # macOS：GitHub 的 Intel runner（macos-13）已退役，两种架构都在 Apple Silicon
          # runner 上构建。Electron 为各架构预编译了二进制，本项目又没有 native 模块，
          # 因此交叉构建 x64 包是安全的。
          - os: macos-15
            target: mac
            arch: x64
            label: macOS x64
            artifact: mac-x64
          - os: macos-15
            target: mac
            arch: arm64
            label: macOS arm64
            artifact: mac-arm64
          # Windows：runner 本身是 x64，arm64 包同样由 electron-builder 交叉构建
          - os: windows-latest
            target: win
            arch: x64
            label: Windows x64
            artifact: win-x64
          - os: windows-latest
            target: win
            arch: arm64
            label: Windows arm64
            artifact: win-arm64

    steps:
      # checkout 的 ref 指向不存在的标签时，只会抛一句 "The process 'git' failed
      # with exit code 1"，完全看不出是标签没推上来，所以提前用 API 拦下。
      - name: 确认标签已推送到远端
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${INPUT_TAG}")
          if [ "$code" != "200" ]; then
            echo "::error::远端没有标签 ${INPUT_TAG}（GitHub API 返回 ${code}）。请先在本地执行：git tag ${INPUT_TAG} && git push origin ${INPUT_TAG}"
            exit 1
          fi
          echo "标签 ${INPUT_TAG} 已存在"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 填了 tag 就检出该标签，留空则检出手动运行时所选的分支
          ref: ${{ inputs.tag || github.ref }}

      # 标签版本与 package.json 对不上时，产物文件名会和标签打架，所以提前拦下
      - name: 校验标签版本
        if: inputs.tag != ''
        shell: bash
        env:
          # 经 env 传递，避免把用户输入直接拼进脚本
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag_version="${INPUT_TAG#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::标签 ${INPUT_TAG} 与 package.json 的 ${pkg_version} 不一致，请先同步版本号"
            exit 1
          fi
          echo "版本校验通过：${INPUT_TAG}"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Electron 的两个缓存目录放在工作目录之外，既方便 actions/cache 复用，
      # 也避免被 electron-builder 误打进应用包。
      #
      # runner context 在 workflow 顶层 env 和 job 级 env 里都不可用（GitHub 会
      # 报 "Unrecognized named-value: 'runner'"），只能在 step 内部求值，所以路径
      # 没法定义成一处共享。下面三处必须保持一致：
      #   1. 本步骤的 path（actions/cache 要知道缓存哪些目录）
      #   2. 「安装依赖」的 env（electron 的 postinstall 在这里下载二进制）
      #   3. 「打包」的 env（electron-builder 在这里读缓存）
      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package.json') }}

      # 项目的 .npmrc 指向国内的 npmmirror，而 runner 在海外，删掉这两行改走官方源。
      #
      # 这里不能用 `sed -i -E`：macOS runner 上的 BSD sed 会把 -E 当成 -i 的备份后缀，
      # 结果是文件原封不动、还多出一个 .npmrc-E，退出码却是 0 —— 静默失效，最难查。
      # 改用重定向写法（BSD/GNU sed 通吃），并在结尾断言一次。
      - name: 切换下载源
        shell: bash
        run: |
          sed -E '/^electron(_builder_binaries)?_mirror=/d' .npmrc > .npmrc.tmp
          mv .npmrc.tmp .npmrc
          if grep -q -E '^electron(_builder_binaries)?_mirror=' .npmrc; then
            echo "::error::.npmrc 中的镜像源没有被删除，electron 会去下载国内镜像"
            exit 1
          fi
          cat .npmrc

      # electron 和 electron-builder 的 postinstall 都在这一步下载各自的二进制，
      # 缓存位置必须与 actions/cache 的 path 一致，否则缓存永远命不中，打包步骤
      # 还会再下载一份。
      - name: 安装依赖
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: pnpm install --frozen-lockfile

      # 含 typecheck，类型不过直接失败
      - name: 构建
        run: pnpm build

      # --publish never：交给最后的 release job 统一发布，避免多个 job 抢建同一个 Release。
      # electron-builder.yml 里同样硬编码了 npmmirror，用命令行参数覆盖掉。
      #
      # 注意：这里不要设置 CSC_IDENTITY_AUTO_DISCOVERY=false。它会让 electron-builder
      # 跳过整个签名流程，连 ad-hoc 签名一起跳过，产出的 arm64 包在 Apple Silicon 上
      # 会被系统直接拒绝启动。macOS 所需的 ad-hoc 签名由 electron-builder.yml 的
      # mac.identity 配置。
      - name: 打包
        # electron 的下载器和 electron-builder 读这两个变量决定缓存目录，
        # 必须与上面 actions/cache 的 path 一致。同样因为 runner context
        # 在 job 级 env 不可用，只能定义在 step 级。
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: pnpm exec electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never "-c.electronDownload.mirror=https://github.com/electron/electron/releases/download/"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    name: 创建草稿 Release
    needs: build
    # 只有填了 tag 的运行会发布；留空时产物留在 Actions 页面下载
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh release

      # 草稿模式：确认四个包都能正常安装后再手动点 Publish
      - name: 创建草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # 手动运行没有标签 ref，github.ref_name 会是分支名，必须显式指定标签
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: release/*
